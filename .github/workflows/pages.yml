name: 트렌드 수집 및 Pages 배포

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 22 * * *"   # 매일 07:00 한국 시간 (= 전날 22:00 UTC, 몇 분 늦게 돌 수 있음)
    - cron: "0 2 18 11 *"  # 2026-11-18 11:00 한국 시간 1회용 (= 02:00 UTC). 다 돌면 지워도 됨
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 데이터 수집 및 정적 사이트 생성
        run: python3 collect.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
