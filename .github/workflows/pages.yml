name: 트렌드 수집 및 Pages 배포

on:
  schedule:
    - cron: "0 22 * * *"   # 매일 07:00 한국 시간 (= 전날 22:00 UTC, 몇 분 늦게 돌 수 있음)
    - cron: "0 6 18 11 *"  # 오늘 2026-11-18 15:00 KST. 아래 연도/날짜 검사로 일회성 제한
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  schedule-check:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ] || [ "$SCHEDULE" = "0 22 * * *" ] || [ "$(date -u +%F)" = "2026-11-18" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
  build-deploy:
    needs: schedule-check
    if: needs.schedule-check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 데이터 수집 및 정적 사이트 생성
        run: python3 collect.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
